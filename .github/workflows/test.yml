name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Синтаксис ES5 (движок webview в Shadowrocket)
        run: npx --yes acorn@8 --ecma5 --silent ru-adblock.js
      - name: Тесты
        run: node tests/run.js
